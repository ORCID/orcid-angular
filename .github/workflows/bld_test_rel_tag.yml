name: bld_test_rel_tag

on:
  workflow_call:
    inputs:
      version_tag:
        description: 'version tag to use'
        required: false
        default: "latest"
        type: string
      bump:
        description: 'whether to bump the version number by a major minor patch amount or try gitlog'
        required: false
        default: "patch"
        type: string
      ref:
        description: 'git reference to use with the checkout use default_branch to have that calculated'
        required: false
        default: "default"
        type: string
      rel_tag:
        description: Whether to tag the code
        type: boolean
        required: false
        default: true
      run_docker:
        description: 'Whether to run Docker builds'
        type: boolean
        required: false
        default: false
      deploy:
        description: 'Whether to upload the WAR and push the i18n source. Set false for a dry run.'
        type: boolean
        required: false
        default: true

  workflow_dispatch:
    inputs:
      version_tag:
        description: 'version tag to use'
        required: false
        default: "latest"
        type: string
      bump:
        description: |
          How to optionally bump the semver version ( Major.Minor.Patch ) : git log will be searched for
          '#major #minor #patch' or feat/ or fix/ branch names to optionally override the bump. Set to none to keep a specific version
        required: false
        options:
          - patch
          - minor
          - major
          - none
        type: choice
      ref:
        description: 'git reference to use with the checkout use default_branch to have that calculated'
        required: false
        default: "default_branch"
        type: string
      rel_tag:
        description: Whether to tag the code
        type: boolean
        required: false
        default: true
      run_docker:
        description: 'Whether to run Docker builds'
        type: boolean
        required: false
        default: false
      deploy:
        description: 'Whether to upload the WAR and push the i18n source. Set false for a dry run.'
        type: boolean
        required: false
        default: true

# cancel running job if another commit comes in
concurrency:
  group: main-${{ github.ref }}-1
  cancel-in-progress: true

jobs:
  # Extract messages.xlf from the code and push it to Transifex. Off the
  # critical path: nothing downstream depends on it.
  # Formatting and unit tests are PR gates (pr.yml), not main gates: branch
  # protection requires an up-to-date, green branch, so main re-tests a tree
  # that has already passed.
  push_i18n_source:
    if: ${{ github.ref == 'refs/heads/main' && inputs.deploy }}
    uses: ./.github/workflows/push_i18n_source.yml
    secrets: inherit # pass all secrets for Transifex

##############################################################################

  lint:
    uses: ./.github/workflows/lint.yml

##############################################################################
  # uses maven to build via yarn into a war file
  # No `needs: lint`. lint is a required check on the pull request (commit.yml
  # produces `lint / pre-commit`), so main is re-running something the merge
  # already gated on. Running it in parallel takes ~40s off the critical path;
  # rel_tag still waits for it, so nothing is tagged or released on a lint failure.
  bld_mvn:
    uses: ./.github/workflows/bld_mvn.yml
    secrets: inherit # pass all secrets for uploading assets
    permissions:
      checks: write
      contents: read
      issues: read
      pull-requests: write
    with:
      version_tag: ${{ inputs.version_tag }}
      bump: ${{ inputs.bump }}
      ref: ${{ inputs.ref }}
      deploy: ${{ inputs.deploy }}

  bld_docker:
    if: ${{ inputs.run_docker }}
    uses: ./.github/workflows/bld_docker.yml
    secrets: inherit # pass all secrets for uploading assets
    permissions:
      checks: write
      contents: read
      issues: read
      pull-requests: write
    with:
      version_tag: ${{ inputs.version_tag }}
      bump: ${{ inputs.bump }}
      ref: ${{ inputs.ref }}

##############################################################################

  # Gated on lint as well as the WAR: the build can run in parallel, but nothing
  # gets tagged or released while lint is red. lint (~30s) always finishes long
  # before bld_mvn (~4min), so this adds no latency.
  rel_tag:
    uses: ./.github/workflows/rel_tag.yml
    if: ${{ inputs.rel_tag }}
    needs:
      - bld_mvn
      - lint
    with:
      version_tag: ${{ inputs.version_tag }}
      bump: ${{ inputs.bump }}
      ref: ${{ inputs.ref }}
    secrets: inherit # pass all secrets
    permissions:
      checks: write
      contents: write
      issues: read
      pull-requests: write
