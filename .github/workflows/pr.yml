name: pr

# Nothing in this chain asks for more than a fork pull request is granted.
#
# On a `pull_request` whose head is a fork, GitHub caps the run at read-only.
# Requesting `contents: write` on a reusable-workflow call (`uses:`) exceeds that
# ceiling, and for `uses:` jobs GitHub validates the request when the run is
# created rather than capping it, which can fail the whole workflow with
# startup_failure. That would leave every required check stuck on "Expected"
# with no red X to explain it.
#
# The `format` job pushes with secrets.RELEASE_TOKEN, a PAT handed to
# actions/checkout and add-and-commit, so GITHUB_TOKEN's contents permission
# never gated that push anyway.
permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened]

  workflow_call:

  workflow_dispatch:

# cancel running job if another commit comes in
concurrency:
  group: pr-${{ github.ref }}-1
  cancel-in-progress: true

jobs:
  # Produces the required `lint / pre-commit` context. It lives here rather than
  # in a push-triggered workflow so it also reports on pull requests from a fork,
  # whose pushes fire in the fork and never reach this repository's check runs.
  lint:
    uses: ./.github/workflows/lint.yml

  test_yarn:
    uses: ./.github/workflows/test_yarn.yml

  # Prettier gate. Applies the fix to the PR branch rather than asking the
  # author to. The push starts a new run on the formatted commit and the
  # concurrency group above cancels this one, so nothing is tested twice.
  # Must be a required status check; see .github/workflows/format.yml.
  format:
    uses: ./.github/workflows/format.yml
    secrets: inherit

  # Full production build: the only place the postbuild layout is exercised.
  bld_yarn:
    uses: ./.github/workflows/bld_yarn.yml
#   NOTE: codeql is only available on public repos or enterprise github accounts
#   codeql:
#     uses: ./.github/workflows/codeql.yml
