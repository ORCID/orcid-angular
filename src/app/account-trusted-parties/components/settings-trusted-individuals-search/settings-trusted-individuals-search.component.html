<strong
  class="orc-font-body-small search-title"
  i18n="@@account.invitationSearchTitle"
  >Add an account delegate</strong
>
<p class="orc-font-body" i18n="@@account.invitationSearchDescription">
  Enter an email address or ORCID iD to find an ORCID user to add as an
  account delegate
</p>
<div class="search-container">
  <mat-form-field
    appearance="outline"
    class="mat-form-field-min"
    [ngClass]="{ mobile: isMobile, desktop: !isMobile }"
  >
    <input
      i18n-aria-label="@@account.invitationSearchLabel"
      aria-label="ORCID iD or email address"
      matInput
      [(ngModel)]="searchValue"
      (ngModelChange)="inputChanged()"
      (keyup.enter)="search(searchValue)"
      [disabled]="loading"
      [attr.aria-invalid]="!!error"
      aria-describedby="invitation-error"
    />
    <button
      matSuffix
      mat-icon-button
      type="button"
      id="cy-search-orcid-for-trusted-individuals"
      (click)="search(searchValue)"
      [disabled]="loading"
      i18n-aria-label="@@account.invitationSearchButton"
      aria-label="Search"
    >
      <mat-icon>search</mat-icon>
    </button>
  </mat-form-field>
</div>
<div class="row h-baseline">
  <mat-progress-bar mode="indeterminate" *ngIf="loading"></mat-progress-bar>
</div>
<app-alert-message
  id="invitation-error"
  *ngIf="error"
  type="warning"
  role="alert"
  class="invitation-alert"
>
  <div content>{{ error }}</div>
</app-alert-message>
<app-alert-message
  *ngIf="success"
  type="success"
  role="status"
  class="invitation-alert"
>
  <div content>
    <ng-container i18n="@@account.invitationSentTo"
      >An account delegate invitation has been sent to</ng-container
    >
    <strong>{{ sentTo }}</strong>
  </div>
</app-alert-message>
<div *ngIf="result && request" class="result-row">
  <div class="result-info">
  <ng-container *ngIf="request.lookupType === 'ORCID'; else emailResult">
    <strong class="orc-font-body" *ngIf="result.publicName">{{
      result.publicName
    }}</strong>
    <p class="orc-font-body" *ngIf="result.highlightedAffiliation">
      {{ result.highlightedAffiliation }}
    </p>
    <a
      *ngIf="result.publicRecordUrl"
      [href]="result.publicRecordUrl"
      target="_blank"
      rel="noreferrer noopener"
      class="underline"
      >{{ result.orcid }}</a
    >
  </ng-container>
  <ng-template #emailResult
    ><p class="orc-font-body">{{ request.value }}</p></ng-template
  >
  </div>
  <button
    mat-stroked-button
    class="invite-button"
    (click)="send()"
    [disabled]="loading"
  >
    <mat-icon>person_add_alt</mat-icon>
    <ng-container i18n="@@account.invitationSend"
      >Invite as delegate</ng-container
    >
  </button>
</div>
