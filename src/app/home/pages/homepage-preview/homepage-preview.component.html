<main class="homepage-preview">
  <ng-container *ngIf="content; else notRenderable">
    <app-homepage-page [content]="content"></app-homepage-page>
  </ng-container>

  <ng-template #notRenderable>
    <p class="homepage-preview-message" role="status">
      {{ problem || 'Waiting for the editor…' }}
    </p>
  </ng-template>
</main>
