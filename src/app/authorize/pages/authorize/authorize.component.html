<main id="main" *ngIf="!loading">
  <div class="container">
    <div class="row space-around">
      <div class="col m6 s4 l6">
        <!-- showInterstital keeps this card mounted after showInterstitial()
             clears showAuthorizationComponent. The portal outlet below lives
             inside the card, so without it the interstitial is attached and
             then destroyed in the same tick, leaving a blank page. -->
        <mat-card
          *ngIf="
            showAuthorizationComponent ||
            showAuthorizationError ||
            showInterstital
          "
          appearance="outlined"
          class="orcid-wizard authorize-wrapper"
          [ngClass]="{
            mobile: platform.columns4
          }"
        >
          <app-form-authorize
            *ngIf="showAuthorizationComponent"
            (redirectUrl)="handleRedirect($event)"
          ></app-form-authorize>
          <ng-template #interstitialOutlet cdkPortalOutlet></ng-template>
          <app-oauth-error *ngIf="showAuthorizationError"></app-oauth-error>
        </mat-card>
      </div>
    </div>
  </div>
</main>
