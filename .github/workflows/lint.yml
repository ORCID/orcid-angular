name: lint

# we don't pay for pre-commit-ci yet so need this for private repos

# Only runs pre-commit; it calls no GitHub API. Kept at read so this workflow can
# be called from pr.yml, where a fork pull request caps the run at read-only.
permissions:
  contents: read

on:
  workflow_call:
  workflow_dispatch:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'
      - uses: pre-commit/action@576ff52938d158a24ac7e009dfa94b1455e7df99
