<strong
  class="orc-font-body-small search-title"
  i18n="@@account.invitationSearchTitle"
  >Invite a trusted individual</strong
>
<div class="search-container">
  <mat-form-field
    appearance="outline"
    class="mat-form-field-min"
    [ngClass]="{ mobile: isMobile, desktop: !isMobile }"
  >
    <mat-label i18n="@@account.invitationSearchLabel"
      >ORCID iD or email address</mat-label
    >
    <input
      matInput
      [(ngModel)]="searchValue"
      (ngModelChange)="inputChanged()"
      (keyup.enter)="search(searchValue)"
      [disabled]="loading"
      [attr.aria-invalid]="!!error"
      aria-describedby="invitation-error"
    />
  </mat-form-field>
  <button
    mat-raised-button
    id="cy-search-orcid-for-trusted-individuals"
    (click)="search(searchValue)"
    [disabled]="loading"
    color="primary"
    class="search-button"
    [ngClass]="{ desktop: !isMobile, mobile: isMobile }"
    i18n="@@account.invitationSearchButton"
  >
    Search
  </button>
</div>
<div class="row h-baseline">
  <mat-progress-bar mode="indeterminate" *ngIf="loading"></mat-progress-bar>
</div>
<p id="invitation-error" *ngIf="error" role="alert">{{ error }}</p>
<p *ngIf="success" role="status" i18n="@@account.invitationSent">
  Invitation sent.
</p>
<div *ngIf="result && request">
  <ng-container *ngIf="request.lookupType === 'ORCID'; else emailResult">
    <p *ngIf="result.publicName">{{ result.publicName }}</p>
    <p *ngIf="result.highlightedAffiliation">
      {{ result.highlightedAffiliation }}
    </p>
    <a
      *ngIf="result.publicRecordUrl"
      [href]="result.publicRecordUrl"
      target="_blank"
      rel="noreferrer noopener"
      class="underline"
      >{{ result.orcid }}</a
    >
  </ng-container>
  <ng-template #emailResult
    ><p>{{ request.value }}</p></ng-template
  >
  <div class="topBottomMargin">
    <button
      mat-raised-button
      color="primary"
      (click)="send()"
      [disabled]="loading"
      i18n="@@account.invitationSend"
    >
      Send invitation
    </button>
  </div>
</div>
