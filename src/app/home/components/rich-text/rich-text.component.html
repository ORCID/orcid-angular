@for (paragraph of paragraphs; track $index) {
<p class="rich-text-paragraph" [attr.lang]="lang || null" [attr.dir]="textDir">
  @for (node of paragraph; track $index) { @switch (node.type) { @case ('bold')
  {
  <strong>{{ node.text }}</strong>
  } @case ('link') {
  <a
    class="rich-text-link"
    [href]="node.href"
    [attr.target]="node.external ? '_blank' : null"
    [attr.rel]="node.external ? 'noopener noreferrer' : null"
  >
    <bdi>{{ node.text }}</bdi>
    @if (node.external) {
    <svg
      class="rich-text-external-icon"
      viewBox="0 0 24 24"
      aria-hidden="true"
      focusable="false"
    >
      <path d="M14 3h7v7h-2V6.41l-9.29 9.3-1.42-1.42 9.3-9.29H14V3z"></path>
      <path
        d="M19 19H5V5h6V3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-6h-2v6z"
      ></path>
    </svg>
    <span class="cdk-visually-hidden">{{ opensInNewTab }}</span>
    }
  </a>
  } @default {
  <ng-container>{{ node.text }}</ng-container>
  } } }
</p>
}
