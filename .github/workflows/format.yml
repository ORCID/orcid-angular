name: format

# Formatting gate for pull requests.
#
# On a same-repo PR this job APPLIES prettier and pushes the result to the PR
# branch, so nobody has to fix whitespace by hand. The push starts a new PR run
# on the formatted commit and pr.yml's concurrency group cancels this one, so
# the heavy jobs run once, on the commit that actually merges.
#
# It must be a required status check. Because required checks are evaluated on
# the PR's latest commit, the formatted commit is the one that gets tested, and
# a PR cannot merge until formatting has been applied.
#
# Three cases cannot push and fall back to a plain check that fails on drift:
#   - PRs from forks (no write access to the contributor's branch)
#   - Dependabot PRs (its runs get no repository secrets)
#   - non-pull_request callers, i.e. the ci_only dry run on main
# For Dependabot the check passes anyway: prettier ignores package.json and has
# no parser for yarn.lock, which is all it changes.
#
# Nothing formats main any more; there are no bot commits on the default branch.

# read only on purpose. The push below authenticates with secrets.RELEASE_TOKEN,
# a PAT, so GITHUB_TOKEN never needed write; requesting it would exceed the
# read-only ceiling GitHub applies to a fork pull request.
permissions:
  contents: read

on:
  workflow_call:
    secrets:
      RELEASE_TOKEN:
        required: false
        description: >-
          PAT used to push the formatting fix back to the pull request branch.
          Optional: it is absent for fork pull requests and for Dependabot, and
          the job checks formatting instead of applying it when it is missing.

  workflow_dispatch:

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      # Three conditions, because three different situations cannot push:
      # a fork (no write access to someone else's branch), Dependabot (its
      # pull_request runs get no repository secrets, and this repo configures
      # none in the Dependabot store), and the ci_only dry run (a push event,
      # so there is no PR branch to push to).
      - name: Decide whether this run can push a fix
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          # Not head.repo.fork: that asks "is the head repo a fork of anything",
          # which only coincides with what we mean while this repo is not itself
          # a fork. Comparing names asks the actual question.
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          # The condition that really decides it. Empty for forks and Dependabot,
          # and for a rotated or removed secret.
          HAS_TOKEN: ${{ secrets.RELEASE_TOKEN != '' }}
        run: |
          if [ "$EVENT" = "pull_request" ] && [ "$SAME_REPO" = "true" ] && [ "$HAS_TOKEN" = "true" ]; then
            echo "can_push=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_push=false" >> "$GITHUB_OUTPUT"
            echo "Checking only (event=$EVENT same_repo=$SAME_REPO has_token=$HAS_TOKEN)."
          fi

      # Check out the PR BRANCH, not the merge ref, so a commit can be pushed
      # back to it. RELEASE_TOKEN rather than GITHUB_TOKEN: a push made with the
      # default token does not trigger workflows, which would leave the new head
      # commit with no status checks and block the merge.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        if: steps.mode.outputs.can_push == 'true'
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.RELEASE_TOKEN }}

      # The PR's own head, not the default merge ref. Otherwise a fork PR is
      # judged on its branch merged into main, and drift on main would fail an
      # innocent PR with a message telling the author to format files they never
      # touched. Falls back to the default ref on a push event.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        if: steps.mode.outputs.can_push != 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: ./.github/actions/yarn-install

      # Check-only path: fork PRs and the ci_only dry run.
      - name: Check formatting
        if: steps.mode.outputs.can_push != 'true'
        run: |
          if ! yarn format:check; then
            echo "::error::Formatting issues found. Run 'yarn format' and push."
            exit 1
          fi

      - name: Apply formatting
        if: steps.mode.outputs.can_push == 'true'
        run: yarn format

      - name: Commit and push the fix
        id: fix
        if: steps.mode.outputs.can_push == 'true'
        uses: EndBug/add-and-commit@a94899bca583c204427a224a7af87c02f9b325d5 # v9.1.4
        with:
          message: '🤖 GITHUB ACTIONS prettier'
          default_author: github_actions
          push: true
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      - name: Report
        if: steps.mode.outputs.can_push == 'true'
        run: |
          if [ "${{ steps.fix.outputs.committed }}" = "true" ]; then
            echo "Formatting was applied and pushed as ${{ steps.fix.outputs.commit_long_sha }}."
            echo "This run is superseded by the run on that commit."
            {
              echo "### Formatting applied"
              echo ""
              echo "prettier changed one or more files. The fix was pushed as \`${{ steps.fix.outputs.commit_long_sha }}\`; CI is running on that commit."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Formatting already clean."
          fi
