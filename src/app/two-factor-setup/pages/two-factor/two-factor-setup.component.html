<main id="main">
  <!-- Held until the flag is in: see flagResolved on the component. -->
  <div
    *ngIf="flagResolved"
    class="container"
    [ngClass]="{
      mobile: !platform.columns12
    }"
  >
    <div class="row space-around">
      <div
        [ngClass]="{
          'col l5 m6 s4': !platform.columns12
        }"
      >
        <app-two-factor-enable
          *ngIf="step === 'enable'"
          [subtitle]="enableSubtitle"
          (twoFactorEnabled)="twoFactorEnabled($event)"
        >
        </app-two-factor-enable>
        <app-two-factor-recovery-phone
          *ngIf="step === 'recoveryPhone'"
          [subtitle]="recoveryPhoneSubtitle"
          [elevatedAt]="elevatedAt"
          (completed)="recoveryPhoneCompleted()"
          (failed)="recoveryPhoneFailed($event)"
          (elevationExpired)="recoveryPhoneElevationExpired()"
        >
        </app-two-factor-recovery-phone>
        <app-two-factor-recovery-codes
          *ngIf="step === 'recoveryCodes'"
          [subtitle]="recoveryCodesSubtitle"
          [backupCodes]="backupCodes"
          [backupCodesClipboard]="backupCodesClipboard"
        >
        </app-two-factor-recovery-codes>
      </div>
    </div>
  </div>
</main>
