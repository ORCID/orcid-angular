name: pr

# read-only repo token
# no access to secrets

on:
  pull_request:
    types: [opened, synchronize, reopened]

  workflow_call:

  workflow_dispatch:

# cancel running job if another commit comes in
concurrency:
  group: pr-${{ github.ref }}-1
  cancel-in-progress: true

jobs:
  test_yarn:
    uses: ./.github/workflows/test_yarn.yml

  # Prettier gate. Previously an auto-committing job on main, which cancelled
  # and re-ran the whole release pipeline whenever it had to fix something.
  format_check:
    uses: ./.github/workflows/format_check.yml

  # Full production build: the only place the postbuild layout is exercised.
  bld_yarn:
    uses: ./.github/workflows/bld_yarn.yml
#   NOTE: codeql is only available on public repos or enterprise github accounts
