<section class="hero">
  <h1 class="hero-title mat-headline-4">{{ title }}</h1>

  <mat-tab-group
    class="hero-tabs"
    mat-stretch-tabs="false"
    animationDuration="0ms"
    [disablePagination]="false"
  >
    <mat-tab *ngFor="let audience of audiences" [label]="audience.label">
      <ng-template matTabContent>
        <div class="hero-panel">
          <img
            class="hero-background"
            [src]="audience.background"
            alt=""
            aria-hidden="true"
          />
          <div class="hero-panel-content">
            <div class="container">
              <div class="row">
                <app-rich-text
                  class="col l8 m8 s4 hero-intro mat-subtitle-1"
                  [markdown]="audience.intro"
                ></app-rich-text>
              </div>
              <div class="row">
                <app-homepage-feature-card
                  class="col l6 m4 s4"
                  *ngFor="let feature of audience.features"
                  [feature]="feature"
                ></app-homepage-feature-card>
              </div>
            </div>
          </div>
        </div>
      </ng-template>
    </mat-tab>
  </mat-tab-group>
</section>
