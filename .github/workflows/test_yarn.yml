name: test_yarn

on:
  workflow_call:
  workflow_dispatch:

jobs:
  test_yarn:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/yarn-install

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .angular/cache
          key: ${{ runner.os }}-ng-cache-${{ hashFiles('yarn.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ng-cache-${{ hashFiles('yarn.lock') }}-

      # Characterization tests for scripts/postbuild.ts. Node-only and a couple
      # of seconds, so they run before the browser suite.
      - run: yarn test:scripts
      - run: yarn typecheck:scripts

      - run: yarn test-headless:ci
